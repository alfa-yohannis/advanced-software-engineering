name: deploy-local

on:
  workflow_run:
    workflows: ["CI Tests (session-04)"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    # Deploy only what CI tested on main: a successful run that a push to main
    # started. Runs for other branches and for pull requests deploy nothing.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v5
        with:
          # The commit that CI tested, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Diagnostics
        run: |
          echo "Runner:"; hostname
          echo "User:"; whoami
          echo "PWD:"; pwd
          docker version
          docker compose version
          docker ps -a || true

      - name: Run app locally (compose)
        run: |
          docker compose -f projects/session-04/docker-compose.yml down || true
          docker compose -f projects/session-04/docker-compose.yml up -d --build
          docker compose -f projects/session-04/docker-compose.yml ps
