name: CI Tests (session-04)

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/session-04

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # the packages of the three services plus the test tools
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest -q tests/unit

  integration-tests:
    name: Integration / E2E Tests (docker-compose)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build and start stack
        run: |
          docker compose up -d --build

      - name: Wait for the stack
        run: |
          # ask the API and the web service through the gateway until both answer
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8088/api/healthz
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8088/healthz

      - name: Run integration tests
        run: |
          pytest -q tests/integration/test_e2e.py --base-url http://localhost:8088

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Shutdown stack
        if: always()
        run: |
          docker compose down -v
