# docker-compose.yml
# Minimal local stack for the TTS case study:
# - gateway (nginx; one address for the page and the API)
# - api (FastAPI + Redis queue/state)
# - web (player page + MP3 serving from MinIO)
# - worker (Piper + ffmpeg synth -> MP3 -> MinIO)
# - redis (queue/state)
# - minio (S3-compatible object storage)
#
# Assumptions:
# - services/api has: api.py, requirements.txt, Dockerfile
# - services/web has: web.py, requirements.txt, Dockerfile, static/index.html
# - services/worker has: worker.py, requirements.txt, Dockerfile
# - the worker Dockerfile downloads the piper binary and the voice model
#   /models/en_GB-alan-medium.onnx into the image

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # The official minio/minio image is no longer on Docker Hub. Silo is a community
  # fork of the MinIO server that keeps its S3 API, MINIO_* settings and start command.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: dev
      REDIS_URL: redis://redis:6379/0
      MP3_BUCKET: tts-dev
      PUBLIC_BASE_URL: ""          # leave empty for relative /mp3/.. (served by web)
      INTERNAL_TOKEN: changeme
    depends_on:
      - redis
    ports:
      - "8000:8000"   # direct API access (optional; the gateway routes /api to it)
    # healthcheck (optional)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./services/web
    environment:
      APP_ENV: dev
      # Web serves MP3 from MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      MP3_BUCKET: tts-dev
      # Web JS calls API at /api (we map that using nginx below), so open the
      # page through the gateway on :8088. On :8080 the web service has no /api.
    depends_on:
      - minio
    ports:
      - "8080:8000"   # direct web access (optional; /healthz and /mp3/* work here)

  # Lightweight reverse proxy to keep same-origin:
  # - http://localhost:8088/      -> web
  # - http://localhost:8088/api/* -> api
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      context: ./services/worker
    environment:
      APP_ENV: dev
      REDIS_URL: redis://redis:6379/0
      QUEUE_KEY: jobs:queue:dev
      API_BASE_URL: http://api:8000
      INTERNAL_TOKEN: changeme

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      MP3_BUCKET: tts-dev

      # Piper settings
      PIPER_MODEL_PATH: /models/en_GB-alan-medium.onnx
      PIPER_MODEL_CONFIG_PATH: /models/en_GB-alan-medium.onnx.json
      PIPER_LENGTH_SCALE: "1.0"
    depends_on:
      - redis
      - minio
      - api
    deploy:
      replicas: 1

volumes:
  minio_data:
