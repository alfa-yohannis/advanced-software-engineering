# gateway/nginx.conf
server {
  listen 80;

  # Docker's DNS server. Because proxy_pass below uses a variable, nginx looks up
  # "web" and "api" while it handles requests and keeps each answer for 1 second.
  # A fixed name is looked up only once, at startup. The gateway would then keep
  # the old address after "docker compose up -d --build" recreates a container
  # with another one.
  resolver 127.0.0.11 valid=1s ipv6=off;

  # Web UI (and /mp3/*)
  location / {
    set $web http://web:8000;
    proxy_pass $web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API under /api/*
  # proxy_pass with a variable sends the path on unchanged, so rewrite removes
  # the /api prefix first.
  location /api/ {
    set $api http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
