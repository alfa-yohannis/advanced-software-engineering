apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # Image minio/mc sudah tidak ada di Docker Hub. Job ini hanya mencetak
          # penanda, jadi image kecil mana pun cukup.
          image: busybox:1.36
          command: ["sh", "-c", "echo MinIO bootstrap placeholder"]
