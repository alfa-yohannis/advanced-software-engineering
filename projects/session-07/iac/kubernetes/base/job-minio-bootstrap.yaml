apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # minio/mc is no longer on Docker Hub. This job only prints a placeholder,
          # so any small image will do.
          image: busybox:1.36
          command: ["sh", "-c", "echo MinIO bootstrap placeholder"]
