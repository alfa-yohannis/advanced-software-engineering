apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Image resmi minio/minio sudah tidak ada di Docker Hub. Silo adalah fork 
          # komunitas server MinIO yang mempertahankan S3 API, variabel MINIO_*, dan perintah jalannya.
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          args: ["server", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
